<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>재직자 교육 관리자</title>
<link rel="icon" href="favicon.ico" sizes="any">
<link rel="icon" type="image/png" href="favicon.png">
<meta property="og:title" content="재직자 교육 관리자">
<meta property="og:image" content="https://hyunra94.github.io/assets/og-default.png">
<meta property="og:url" content="https://hyunra94.github.io/[레포명]">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;900&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  :root{
    --bg:#F6F4EF;
    --surface:#FFFFFF;
    --surface-soft:#FAF9F6;
    --line:#E8E1D6;
    --line-strong:#D8CDBD;
    --ink:#241F1A;
    --ink-soft:#756B60;
    --muted:#A3988A;
    --accent:#1F6F68;
    --accent-dark:#124C47;
    --accent-soft:#DDEDEA;
    --gold:#B9822D;
    --green:#227653;
    --danger:#C44E4E;
    --shadow:0 24px 70px rgba(49,40,30,0.13);
    --shadow-soft:0 12px 32px rgba(49,40,30,0.08);
    --radius:8px;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    font-family:'Noto Sans KR', sans-serif;
    background:
      linear-gradient(120deg, rgba(31,111,104,0.08), transparent 34%),
      linear-gradient(180deg, #FBFAF7 0%, var(--bg) 52%, #EFE8DC 100%);
    min-height:100vh;
    color:var(--ink);
  }
  /* ---------- login ---------- */
  #loginScreen{
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:24px;
    position:relative;
    overflow:hidden;
  }
  #loginScreen::before{
    content:"";
    position:absolute;
    inset:20px;
    border:1px solid rgba(36,31,26,0.08);
    pointer-events:none;
  }
  .login-card{
    background:rgba(255,255,255,0.88);
    backdrop-filter:blur(18px);
    border-radius:var(--radius);
    padding:38px 32px 32px;
    box-shadow:var(--shadow);
    width:100%;
    max-width:390px;
    border:1px solid rgba(36,31,26,0.1);
    position:relative;
  }
  .login-card::before{
    content:"ADMIN";
    display:block;
    font-size:11px;
    letter-spacing:0.24em;
    color:var(--accent);
    font-weight:900;
    text-align:center;
    margin-bottom:12px;
  }
  .login-card h1{font-size:24px;margin:0 0 8px;text-align:center;letter-spacing:-0.01em;}
  .login-card .sub{font-size:13px;color:var(--ink-soft);text-align:center;margin-bottom:28px;}
  .login-card label{display:block;font-size:12px;font-weight:800;margin:15px 0 7px;color:var(--ink-soft);}
  .login-card input{
    width:100%;padding:13px 14px;border-radius:var(--radius);
    border:1px solid var(--line);background:var(--surface-soft);
    font-family:inherit;font-size:14.5px;outline:none;color:var(--ink);
    transition:border-color .16s, box-shadow .16s, background .16s;
  }
  .login-card input:focus{border-color:var(--accent);box-shadow:0 0 0 4px rgba(31,111,104,0.12);background:#fff;}
  .login-card button{
    width:100%;margin-top:22px;padding:14px;border:none;border-radius:var(--radius);
    background:linear-gradient(135deg, var(--accent), var(--accent-dark));
    color:#fff;font-family:inherit;font-size:14.5px;font-weight:700;cursor:pointer;
    box-shadow:0 14px 26px rgba(31,111,104,0.24);
    transition:transform .14s, box-shadow .14s;
  }
  .login-card button:active{transform:translateY(1px);box-shadow:0 8px 18px rgba(31,111,104,0.2);}
  .login-toggle{
    text-align:center;margin-top:16px;font-size:12.5px;color:var(--ink-soft);
    text-decoration:none;font-weight:700;
  }
  .login-msg{margin-top:12px;font-size:12.5px;color:var(--danger);text-align:center;min-height:16px;}

  /* ---------- dashboard ---------- */
  #dashboard{display:none;padding:30px 22px 88px;}
  .topbar{
    max-width:1180px;margin:0 auto 22px;
    display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:10px;
  }
  .topbar h1{font-size:23px;margin:0;letter-spacing:-0.02em;}
  .topbar .who{font-size:12.5px;color:var(--ink-soft);}
  .logout-btn{
    border:1px solid var(--line);background:#fff;padding:9px 16px;border-radius:var(--radius);
    font-family:inherit;font-size:12.5px;font-weight:700;color:var(--accent-dark);
    cursor:pointer;box-shadow:var(--shadow-soft);
  }
  .panel{
    max-width:1180px;margin:0 auto 18px;
    background:rgba(255,255,255,0.86);border-radius:var(--radius);padding:22px;
    box-shadow:var(--shadow-soft);border:1px solid rgba(36,31,26,0.09);
    backdrop-filter:blur(14px);
  }
  .panel h2{font-size:15px;margin:0 0 16px;color:var(--ink);letter-spacing:-0.01em;}
  .panel-head{display:flex;justify-content:space-between;align-items:flex-start;gap:14px;margin-bottom:16px;}
  .panel-head h2{margin:0 0 5px;}
  .panel-head p{margin:0;color:var(--ink-soft);font-size:12.5px;line-height:1.45;}
  .admin-grid{display:grid;grid-template-columns:minmax(240px,0.8fr) minmax(0,1.2fr);gap:16px;align-items:start;}
  .add-course-form{display:flex;gap:10px;flex-wrap:wrap;align-items:flex-end;}
  .add-course-form div{flex:1;min-width:140px;}
  .add-course-form label{display:block;font-size:11.5px;color:var(--ink-soft);margin-bottom:6px;font-weight:800;}
  .add-course-form input, .add-course-form select{
    width:100%;padding:11px 12px;border-radius:var(--radius);border:1px solid var(--line);
    background:var(--surface-soft);font-family:inherit;font-size:13.5px;outline:none;color:var(--ink);
  }
  .add-course-form input:focus, .add-course-form select:focus{border-color:var(--accent);background:#fff;}
  .add-course-form button{
    padding:11px 18px;border:none;border-radius:var(--radius);background:var(--accent);
    color:#fff;font-family:inherit;font-size:13px;font-weight:700;cursor:pointer;white-space:nowrap;
  }
  .add-course-form button:hover{background:var(--accent-dark);}
  .mini-form{display:grid;gap:10px;padding:14px;border:1px solid var(--line);border-radius:var(--radius);background:var(--surface-soft);}
  .mini-form label{display:block;font-size:11.5px;color:var(--ink-soft);margin-bottom:6px;font-weight:800;}
  .mini-form input,.mini-form textarea,.mini-form select{
    width:100%;padding:10px 11px;border-radius:var(--radius);border:1px solid var(--line);
    background:#fff;font-family:inherit;font-size:13px;outline:none;color:var(--ink);
  }
  .mini-form textarea{min-height:64px;resize:vertical;line-height:1.45;}
  .mini-form button,.inline-btn{
    padding:9px 13px;border:none;border-radius:var(--radius);background:var(--accent);
    color:#fff;font-family:inherit;font-size:12px;font-weight:800;cursor:pointer;white-space:nowrap;
  }
  .inline-btn.secondary{background:var(--ink);}
  .inline-btn.light{background:#fff;color:var(--accent-dark);border:1px solid var(--line);}
  .management-list{display:grid;gap:8px;}
  .management-row{
    display:grid;grid-template-columns:minmax(140px,1fr) minmax(180px,1.2fr) auto;
    gap:8px;align-items:start;padding:10px;border:1px solid var(--line);border-radius:var(--radius);background:#fff;
  }
  .round-row{grid-template-columns:minmax(150px,0.8fr) minmax(220px,1.2fr) 88px 130px 130px 90px 72px auto;}
  .management-row input,.management-row textarea,.management-row select{
    width:100%;padding:8px 9px;border-radius:7px;border:1px solid var(--line);
    font-family:inherit;font-size:12.5px;background:var(--surface-soft);outline:none;color:var(--ink);
  }
  .management-row textarea{min-height:38px;resize:vertical;line-height:1.4;}
  .toggle-cell{display:flex;align-items:center;gap:6px;min-height:34px;color:var(--ink-soft);font-size:12px;font-weight:800;}
  .toggle-cell input{width:16px;height:16px;accent-color:var(--accent-dark);}
  .new-type-row{
    margin-top:14px;
  }
  .new-type-row label{display:block;font-size:11.5px;color:var(--ink-soft);margin-bottom:6px;font-weight:800;}
  .new-type-row input{
    width:100%;padding:11px 12px;border-radius:var(--radius);border:1px solid var(--line);
    font-family:inherit;font-size:13.5px;outline:none;background:var(--surface-soft);color:var(--ink);
  }
  .new-type-row input:focus{border-color:var(--accent);background:#fff;}
  .filters{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px;}
  .filters select, .filters input{
    padding:10px 12px;border-radius:var(--radius);border:1px solid var(--line);
    font-family:inherit;font-size:13px;background:#fff;outline:none;color:var(--ink);
  }
  table{width:100%;border-collapse:separate;border-spacing:0;font-size:13px;}
  th{
    text-align:left;padding:12px 10px;color:var(--muted);
    font-size:11px;text-transform:uppercase;letter-spacing:0.06em;
    border-bottom:1px solid var(--line);
    background:#FBFAF7;
  }
  td{padding:12px 10px;border-bottom:1px solid #EFEAE2;vertical-align:top;}
  tr:hover td{background:#FCFBF8;}
  .status-badge{
    display:inline-block;padding:4px 10px;border-radius:20px;font-size:11.5px;font-weight:700;
  }
  .status-대기{background:#FFF1D6;color:#9B6414;}
  .status-승인{background:#DDEDEA;color:#14624B;}
  .status-거절{background:#F7DEDE;color:#A33C3C;}
  .status-취소{background:#EDEDED;color:#888;}
  select.status-select{
    border-radius:var(--radius);border:1px solid var(--line);padding:7px 8px;font-family:inherit;font-size:12.5px;background:#fff;
  }
  textarea.memo-input{
    width:100%;min-width:190px;border-radius:var(--radius);border:1px solid var(--line);
    padding:9px 10px;font-family:inherit;font-size:12.5px;resize:vertical;min-height:40px;outline:none;background:var(--surface-soft);
  }
  textarea.memo-input:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(31,111,104,0.1);background:#fff;}
  .save-btn{
    border:none;background:var(--ink);color:#fff;padding:7px 12px;border-radius:var(--radius);
    font-family:inherit;font-size:11.5px;font-weight:700;cursor:pointer;margin-top:6px;
  }
  .save-btn.saved{background:var(--green);}
  .rrn-value{font-family:monospace;font-size:12px;color:var(--ink-soft);}
  .rrn-btn{
    border:1px solid var(--line);background:#fff;color:var(--ink-soft);
    padding:3px 8px;border-radius:6px;font-family:inherit;font-size:10.5px;
    cursor:pointer;margin-top:4px;margin-right:4px;
  }
  .rrn-btn:hover{border-color:var(--accent);color:var(--accent-dark);}
  .rrn-btn[data-mode="full"]{color:var(--danger);border-color:#EAD0D0;}
  .compact-info{font-size:12px;line-height:1.55;color:var(--ink-soft);}
  .compact-info b{display:block;color:var(--ink);font-size:12.5px;}
  .check-list{font-size:12px;line-height:1.6;color:var(--ink-soft);}
  .empty-row{text-align:center;padding:40px;color:var(--ink-soft);font-size:13px;}
  @media (max-width:720px){
    #dashboard{padding:20px 14px 64px;}
    .panel{padding:16px;}
    .topbar h1{font-size:20px;}
    th,td{white-space:nowrap;}
    textarea.memo-input{min-width:150px;}
    .admin-grid{grid-template-columns:1fr;}
    .management-row,.round-row{grid-template-columns:1fr;}
  }
</style>
</head>
<body>

<div id="loginScreen">
  <div class="login-card">
    <h1>관리자 로그인</h1>
    <div class="sub">재직자 교육 신청 관리</div>
    <label>이메일</label>
    <input type="email" id="loginEmail" placeholder="you@jmbc.co.kr">
    <label>비밀번호</label>
    <input type="password" id="loginPassword" placeholder="••••••••">
    <button id="loginBtn">로그인</button>
    <div class="login-toggle" id="toggleMode">관리자 계정은 Supabase Auth에서 발급합니다</div>
    <div class="login-msg" id="loginMsg"></div>
  </div>
</div>

<div id="dashboard">
  <div class="topbar">
    <h1>재직자 교육 신청 관리</h1>
    <div style="display:flex;align-items:center;gap:10px;">
      <span class="who" id="whoAmI"></span>
      <button class="logout-btn" id="logoutBtn">로그아웃</button>
    </div>
  </div>

  <div class="panel">
    <div class="panel-head">
      <div>
        <h2>고정 과정 관리</h2>
        <p>드론, 생성형 AI처럼 신청자가 먼저 고르는 상위 과정입니다.</p>
      </div>
    </div>
    <div class="admin-grid">
      <div class="mini-form">
        <div>
          <label>과정명</label>
          <input type="text" id="typeName" placeholder="예: 드론 교육">
        </div>
        <div>
          <label>설명</label>
          <textarea id="typeDescription" placeholder="신청 화면에 보일 짧은 설명"></textarea>
        </div>
        <button id="addTypeBtn">고정 과정 추가</button>
      </div>
      <div class="management-list" id="typeRows">
        <div class="empty-row">과정 목록을 불러오는 중...</div>
      </div>
    </div>
  </div>

  <div class="panel">
    <div class="panel-head">
      <div>
        <h2>회차 관리</h2>
        <p>각 고정 과정에 연결되는 실제 모집 회차입니다. 신청자는 공개된 회차만 볼 수 있습니다.</p>
      </div>
    </div>
    <div class="add-course-form">
      <div>
        <label>고정 과정</label>
        <select id="newCourseType"><option value="">과정 선택</option></select>
      </div>
      <div><label>회차</label><input type="number" id="newCourseRound" placeholder="3" min="1"></div>
      <div><label>회차명</label><input type="text" id="newCourseName" placeholder="비우면 자동 생성"></div>
      <div><label>시작일</label><input type="date" id="newCourseDate"></div>
      <div><label>종료일</label><input type="date" id="newCourseEndDate"></div>
      <div><label>정원</label><input type="number" id="newCourseCapacity" placeholder="30"></div>
      <button id="addCourseBtn">회차 추가</button>
    </div>
    <div class="management-list" id="courseRows" style="margin-top:14px;">
      <div class="empty-row">회차 목록을 불러오는 중...</div>
    </div>
  </div>

  <div class="panel">
    <h2>신청 현황</h2>
    <div class="filters">
      <select id="filterStatus">
        <option value="">전체 상태</option>
        <option value="대기">대기</option>
        <option value="승인">승인</option>
        <option value="거절">거절</option>
        <option value="취소">취소</option>
      </select>
      <select id="filterCourse"><option value="">전체 과정</option></select>
      <input type="text" id="filterSearch" placeholder="이름/연락처 검색">
    </div>
    <div style="overflow-x:auto;">
      <table>
        <thead>
          <tr>
            <th>신청자</th><th>연락처</th><th>주민번호</th><th>과정</th><th>유입/확인</th><th>상태</th><th>메모</th><th>신청일시</th>
          </tr>
        </thead>
        <tbody id="appRows"><tr><td colspan="8" class="empty-row">불러오는 중...</td></tr></tbody>
      </table>
    </div>
  </div>
</div>

<script>
const SUPABASE_URL = "https://siwatwgncoiknnkglvok.supabase.co";
const SUPABASE_KEY = "sb_publishable_EcpVk6L5gekNjlvJLLcFRw_H7OWeExQ";
const sb = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

let isSignupMode = false;
let allApps = [];
let allCourses = [];
let allCourseTypes = [];

// ---------- auth ----------
document.getElementById('toggleMode').addEventListener('click', () => {
  document.getElementById('loginMsg').textContent = '관리자에게 계정 발급을 요청해주세요.';
});

document.getElementById('loginBtn').addEventListener('click', async () => {
  const email = document.getElementById('loginEmail').value.trim();
  const password = document.getElementById('loginPassword').value;
  const msgEl = document.getElementById('loginMsg');
  msgEl.textContent = '';
  if (!email || !password){ msgEl.textContent = '이메일과 비밀번호를 입력해주세요.'; return; }

  const { data, error } = isSignupMode
    ? await sb.auth.signUp({ email, password })
    : await sb.auth.signInWithPassword({ email, password });

  if (error){ msgEl.textContent = error.message; return; }
  if (isSignupMode && data.user && !data.session){
    msgEl.style.color = 'var(--green)';
    msgEl.textContent = '이메일 인증 후 로그인해주세요.';
    return;
  }
  showDashboard(data.session?.user);
});

document.getElementById('logoutBtn').addEventListener('click', async () => {
  await sb.auth.signOut();
  location.reload();
});

async function checkExistingSession(){
  const { data } = await sb.auth.getSession();
  if (data.session) showDashboard(data.session.user);
}
checkExistingSession();

async function showDashboard(user){
  document.getElementById('loginScreen').style.display = 'none';
  document.getElementById('dashboard').style.display = 'block';
  document.getElementById('whoAmI').textContent = user?.email || '';
  await loadCourseTypes();
  await loadCourses();
  await loadApplications();
}

// ---------- course types (고정 과정명) ----------
async function loadCourseTypes(){
  const { data, error } = await sb.from('course_types').select('*').order('name');
  if (error){
    document.getElementById('typeRows').innerHTML = `<div class="empty-row">과정 불러오기 실패: ${escapeHtml(error.message)}</div>`;
    return;
  }
  allCourseTypes = data || [];
  const sel = document.getElementById('newCourseType');
  const prevValue = sel.value;
  sel.innerHTML = '<option value="">과정 선택</option>' +
    allCourseTypes.map(t => `<option value="${escapeHtml(t.id)}">${escapeHtml(t.name)}</option>`).join('');
  sel.value = prevValue;
  renderCourseTypes();
}

function renderCourseTypes(){
  const list = document.getElementById('typeRows');
  if (allCourseTypes.length === 0){
    list.innerHTML = '<div class="empty-row">등록된 고정 과정이 없습니다</div>';
    return;
  }

  list.innerHTML = allCourseTypes.map(type => `
    <div class="management-row" data-type-id="${escapeHtml(type.id)}">
      <input class="type-name-input" value="${escapeHtml(type.name)}" aria-label="과정명">
      <textarea class="type-desc-input" aria-label="과정 설명">${escapeHtml(type.description || '')}</textarea>
      <button class="inline-btn save-type-btn" data-id="${escapeHtml(type.id)}">저장</button>
    </div>
  `).join('');

  list.querySelectorAll('.save-type-btn').forEach(btn => {
    btn.addEventListener('click', async () => {
      const row = btn.closest('[data-type-id]');
      const id = btn.dataset.id;
      const name = row.querySelector('.type-name-input').value.trim();
      const description = row.querySelector('.type-desc-input').value.trim() || null;
      if (!name) return;

      btn.textContent = '저장 중...';
      const { error } = await sb.from('course_types').update({ name, description }).eq('id', id);
      if (error){
        btn.textContent = '실패';
        return;
      }

      btn.textContent = '저장됨';
      const target = allCourseTypes.find(type => type.id === id);
      if (target){ target.name = name; target.description = description; }
      setTimeout(() => { btn.textContent = '저장'; }, 1200);
      await loadCourses();
    });
  });
}

document.getElementById('addTypeBtn').addEventListener('click', async () => {
  const name = document.getElementById('typeName').value.trim();
  const description = document.getElementById('typeDescription').value.trim() || null;
  if (!name) return;

  const { error } = await sb.from('course_types').insert({ name, description });
  if (!error){
    document.getElementById('typeName').value = '';
    document.getElementById('typeDescription').value = '';
    await loadCourseTypes();
    await loadCourses();
  }
});

// ---------- courses (회차별 개설) ----------
async function loadCourses(){
  const { data, error } = await sb
    .from('courses')
    .select('*, course_types(name)')
    .order('start_date', { ascending: true });
  if (error){
    document.getElementById('courseRows').innerHTML = `<div class="empty-row">회차 불러오기 실패: ${escapeHtml(error.message)}</div>`;
    return;
  }
  allCourses = data || [];
  const sel = document.getElementById('filterCourse');
  sel.innerHTML = '<option value="">전체 과정</option>' +
    allCourses.map(c => `<option value="${escapeHtml(c.id)}">${escapeHtml(c.name)}</option>`).join('');
  renderCourses();
}

document.getElementById('addCourseBtn').addEventListener('click', async () => {
  const typeSel = document.getElementById('newCourseType').value;
  const round = document.getElementById('newCourseRound').value || null;
  const customName = document.getElementById('newCourseName').value.trim();
  const start_date = document.getElementById('newCourseDate').value || null;
  const end_date = document.getElementById('newCourseEndDate').value || null;
  const capacity = document.getElementById('newCourseCapacity').value || null;
  if (!typeSel) return;

  const typeName = allCourseTypes.find(t => t.id === typeSel)?.name || '과정';
  const displayName = customName || (round ? `${typeName} ${round}회차` : typeName);
  const { error: courseError } = await sb.from('courses').insert({
    name: displayName,
    course_type_id: typeSel,
    round: round ? Number(round) : null,
    start_date,
    end_date,
    capacity: capacity ? Number(capacity) : null,
    is_open: true
  });

  if (!courseError){
    document.getElementById('newCourseRound').value = '';
    document.getElementById('newCourseName').value = '';
    document.getElementById('newCourseDate').value = '';
    document.getElementById('newCourseEndDate').value = '';
    document.getElementById('newCourseCapacity').value = '';
    document.getElementById('newCourseType').value = '';
    await loadCourses();
  }
});

function renderCourses(){
  const list = document.getElementById('courseRows');
  if (allCourses.length === 0){
    list.innerHTML = '<div class="empty-row">등록된 회차가 없습니다</div>';
    return;
  }

  list.innerHTML = allCourses.map(course => `
    <div class="management-row round-row" data-course-id="${escapeHtml(course.id)}">
      <select class="course-type-input" aria-label="고정 과정">
        ${allCourseTypes.map(type => `<option value="${escapeHtml(type.id)}" ${type.id === course.course_type_id ? 'selected' : ''}>${escapeHtml(type.name)}</option>`).join('')}
      </select>
      <input class="course-name-input" value="${escapeHtml(course.name)}" aria-label="회차명">
      <input class="course-round-input" type="number" min="1" value="${course.round ?? ''}" aria-label="회차">
      <input class="course-start-input" type="date" value="${escapeHtml(course.start_date || '')}" aria-label="시작일">
      <input class="course-end-input" type="date" value="${escapeHtml(course.end_date || '')}" aria-label="종료일">
      <input class="course-capacity-input" type="number" min="0" value="${course.capacity ?? ''}" aria-label="정원">
      <label class="toggle-cell"><input class="course-open-input" type="checkbox" ${course.is_open !== false ? 'checked' : ''}>공개</label>
      <button class="inline-btn save-course-btn" data-id="${escapeHtml(course.id)}">저장</button>
    </div>
  `).join('');

  list.querySelectorAll('.save-course-btn').forEach(btn => {
    btn.addEventListener('click', async () => {
      const row = btn.closest('[data-course-id]');
      const id = btn.dataset.id;
      const payload = {
        course_type_id: row.querySelector('.course-type-input').value || null,
        name: row.querySelector('.course-name-input').value.trim(),
        round: nullableNumber(row.querySelector('.course-round-input').value),
        start_date: row.querySelector('.course-start-input').value || null,
        end_date: row.querySelector('.course-end-input').value || null,
        capacity: nullableNumber(row.querySelector('.course-capacity-input').value),
        is_open: row.querySelector('.course-open-input').checked
      };
      if (!payload.name) return;

      btn.textContent = '저장 중...';
      const { error } = await sb.from('courses').update(payload).eq('id', id);
      if (error){
        btn.textContent = '실패';
        return;
      }
      btn.textContent = '저장됨';
      setTimeout(() => { btn.textContent = '저장'; }, 1200);
      await loadCourses();
      await loadApplications();
    });
  });
}

// ---------- applications ----------
async function loadApplications(){
  const { data, error } = await sb
    .from('applications')
    .select('id, status, attempt_no, applied_at, cancelled_at, status_updated_at, trainee_id, trainees(name, phone, email, company, birth6, employed_confirmed, privacy_consent, agreement_confirmed, noshow_confirmed, referral_sources, note, admin_memo), courses(id, name)')
    .order('applied_at', { ascending: false });
  if (error){
    document.getElementById('appRows').innerHTML = `<tr><td colspan="8" class="empty-row">불러오기 실패: ${escapeHtml(error.message)}</td></tr>`;
    return;
  }
  allApps = data || [];
  renderApps();
}

function renderApps(){
  const statusFilter = document.getElementById('filterStatus').value;
  const courseFilter = document.getElementById('filterCourse').value;
  const search = document.getElementById('filterSearch').value.trim().toLowerCase();

  let rows = allApps.filter(a => {
    if (statusFilter && a.status !== statusFilter) return false;
    if (courseFilter && a.courses?.id !== courseFilter) return false;
    if (search){
      const hay = `${a.trainees?.name || ''} ${a.trainees?.phone || ''} ${a.trainees?.company || ''} ${a.trainees?.email || ''}`.toLowerCase();
      if (!hay.includes(search)) return false;
    }
    return true;
  });

  const tbody = document.getElementById('appRows');
  if (rows.length === 0){
    tbody.innerHTML = '<tr><td colspan="8" class="empty-row">해당하는 신청 내역이 없습니다</td></tr>';
    return;
  }

  tbody.innerHTML = rows.map(a => `
    <tr data-id="${a.id}">
      <td>
        <div class="compact-info">
          <b>${escapeHtml(a.trainees?.name || '-')}</b>
          ${escapeHtml(a.trainees?.company || '-')}<br>
          생년월일 ${escapeHtml(a.trainees?.birth6 || '-')}
        </div>
      </td>
      <td>
        <div class="compact-info">
          ${escapeHtml(a.trainees?.phone || '-')}<br>
          ${escapeHtml(a.trainees?.email || '-')}
        </div>
      </td>
      <td>
        <span class="rrn-value" data-trainee-id="${escapeHtml(a.trainee_id)}">●●●●●●-●●●●●●●</span><br>
        <button class="rrn-btn" data-trainee-id="${escapeHtml(a.trainee_id)}" data-mode="masked">확인</button>
        <button class="rrn-btn" data-trainee-id="${escapeHtml(a.trainee_id)}" data-mode="full">전체보기</button>
      </td>
      <td>
        ${escapeHtml(a.courses?.name || '-')}
        <div class="compact-info">${escapeHtml(a.attempt_no || 1)}번째 신청</div>
      </td>
      <td>
        <div class="check-list">
          유입: ${escapeHtml(formatList(a.trainees?.referral_sources))}<br>
          재직 ${yesNo(a.trainees?.employed_confirmed)} · 개인정보 ${yesNo(a.trainees?.privacy_consent)}<br>
          협약서 ${yesNo(a.trainees?.agreement_confirmed)} · 노쇼 ${yesNo(a.trainees?.noshow_confirmed)}
          ${a.trainees?.note ? `<br>기타: ${escapeHtml(a.trainees.note)}` : ''}
        </div>
      </td>
      <td>
        <select class="status-select" data-id="${escapeHtml(a.id)}">
          ${['대기','승인','거절','취소'].map(s => `<option value="${s}" ${s===a.status?'selected':''}>${s}</option>`).join('')}
        </select>
      </td>
      <td>
        <textarea class="memo-input" data-id="${escapeHtml(a.id)}" data-trainee-id="${escapeHtml(a.trainee_id)}" placeholder="신청자 메모 입력...">${escapeHtml(a.trainees?.admin_memo || '')}</textarea><br>
        <button class="save-btn" data-id="${escapeHtml(a.id)}" data-trainee-id="${escapeHtml(a.trainee_id)}">저장</button>
      </td>
      <td>
        ${new Date(a.applied_at).toLocaleString('ko-KR')}
        ${a.cancelled_at ? `<div class="compact-info">취소 ${new Date(a.cancelled_at).toLocaleString('ko-KR')}</div>` : ''}
      </td>
    </tr>
  `).join('');

  tbody.querySelectorAll('.save-btn').forEach(btn => {
    btn.addEventListener('click', async () => {
      const id = btn.dataset.id;
      const traineeId = btn.dataset.traineeId;
      const status = tbody.querySelector(`.status-select[data-id="${id}"]`).value;
      const memo = tbody.querySelector(`.memo-input[data-id="${id}"]`).value;
      btn.textContent = '저장 중...';
      const { error: appError } = await sb.from('applications').update({ status }).eq('id', id);
      const { error: traineeError } = await sb.from('trainees').update({ admin_memo: memo || null }).eq('id', traineeId);
      const error = appError || traineeError;
      if (!error){
        btn.textContent = '저장됨 ✓';
        btn.classList.add('saved');
        allApps.forEach(app => {
          if (app.id === id) app.status = status;
          if (app.trainee_id === traineeId && app.trainees) app.trainees.admin_memo = memo;
        });
        setTimeout(() => { btn.textContent = '저장'; btn.classList.remove('saved'); }, 1500);
      } else {
        btn.textContent = '실패';
      }
    });
  });

  tbody.querySelectorAll('.rrn-btn').forEach(btn => {
    btn.addEventListener('click', async () => {
      const traineeId = btn.dataset.traineeId;
      const mode = btn.dataset.mode;
      const valueEl = tbody.querySelector(`.rrn-value[data-trainee-id="${traineeId}"]`);
      if (mode === 'full'){
        if (!confirm('주민등록번호 전체를 조회합니다. 이 열람 기록은 감사 로그에 남습니다. 계속할까요?')) return;
      }
      const fn = mode === 'full' ? 'get_trainee_rrn_full' : 'get_trainee_rrn_masked';
      const { data, error } = await sb.rpc(fn, { p_trainee_id: traineeId });
      if (!error && data){
        valueEl.textContent = data;
      } else {
        valueEl.textContent = '조회 실패';
      }
    });
  });
}

document.getElementById('filterStatus').addEventListener('change', renderApps);
document.getElementById('filterCourse').addEventListener('change', renderApps);
document.getElementById('filterSearch').addEventListener('input', renderApps);

function formatList(value){
  if (!value || value.length === 0) return '-';
  return Array.isArray(value) ? value.join(', ') : String(value);
}

function yesNo(value){
  return value ? '확인' : '미확인';
}

function nullableNumber(value){
  return value === '' || value === null || value === undefined ? null : Number(value);
}

function escapeHtml(value){
  return String(value ?? '')
    .replaceAll('&', '&amp;')
    .replaceAll('<', '&lt;')
    .replaceAll('>', '&gt;')
    .replaceAll('"', '&quot;')
    .replaceAll("'", '&#039;');
}
</script>

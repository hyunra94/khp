<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>2026 재직자 교육 신청</title>
<link rel="icon" href="favicon.ico" sizes="any">
<link rel="icon" type="image/png" href="favicon.png">
<meta property="og:title" content="2026 재직자 교육 신청">
<meta property="og:image" content="https://hyunra94.github.io/assets/og-default.png">
<meta property="og:url" content="https://hyunra94.github.io/[레포명]">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;900&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  :root{
    --bg:#F6F4EF;
    --surface:#FFFFFF;
    --surface-soft:#FAF9F6;
    --line:#E8E1D6;
    --line-strong:#D8CDBD;
    --ink:#241F1A;
    --ink-soft:#756B60;
    --muted:#A3988A;
    --accent:#1F6F68;
    --accent-dark:#124C47;
    --accent-soft:#DDEDEA;
    --coral:#D66B55;
    --error:#C44E4E;
    --shadow:0 24px 70px rgba(49,40,30,0.13);
    --shadow-soft:0 12px 32px rgba(49,40,30,0.08);
    --radius:8px;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    font-family:'Noto Sans KR', sans-serif;
    background:
      linear-gradient(120deg, rgba(31,111,104,0.08), transparent 34%),
      linear-gradient(180deg, #FBFAF7 0%, var(--bg) 50%, #EFE8DC 100%);
    min-height:100vh;
    color:var(--ink);
    padding:36px 18px 82px;
  }
  .wrap{max-width:560px;margin:0 auto;}
  .eyebrow{
    text-align:center;
    font-size:12px;
    letter-spacing:0.18em;
    color:var(--accent);
    font-weight:900;
    margin-bottom:12px;
  }
  h1{
    text-align:center;
    font-size:32px;
    font-weight:900;
    margin:0 0 10px;
    color:var(--ink);
    letter-spacing:-0.025em;
    line-height:1.18;
  }
  .sub{
    text-align:center;
    font-size:14.5px;
    color:var(--ink-soft);
    margin:0 auto 30px;
    line-height:1.6;
  }
  .card{
    background:rgba(255,255,255,0.88);
    border-radius:var(--radius);
    padding:30px 28px;
    box-shadow:var(--shadow);
    border:1px solid rgba(36,31,26,0.1);
    backdrop-filter:blur(16px);
  }
  label{
    display:block;
    font-size:12.5px;
    font-weight:800;
    color:var(--ink);
    margin:20px 0 8px;
  }
  label:first-of-type{margin-top:0;}
  input[type=text], input[type=tel], input[type=email]{
    width:100%;
    padding:14px 14px;
    border-radius:var(--radius);
    border:1px solid var(--line);
    background:var(--surface-soft);
    font-family:inherit;
    font-size:15px;
    color:var(--ink);
    outline:none;
    transition:border-color .16s, box-shadow .16s, background .16s;
  }
  input:focus{border-color:var(--accent);box-shadow:0 0 0 4px rgba(31,111,104,0.12);background:#fff;}
  .course-list{display:flex;flex-direction:column;gap:10px;}
  .course-item{
    display:flex;
    align-items:center;
    gap:12px;
    padding:15px 16px;
    border-radius:var(--radius);
    border:1px solid var(--line);
    background:var(--surface-soft);
    cursor:pointer;
    transition:border-color .16s, background .16s, box-shadow .16s, transform .16s;
  }
  .course-item:hover{
    border-color:var(--line-strong);
    box-shadow:0 8px 20px rgba(49,40,30,0.07);
    transform:translateY(-1px);
  }
  .course-item.checked{
    border-color:var(--accent);
    background:var(--accent-soft);
    box-shadow:inset 0 0 0 1px rgba(31,111,104,0.18);
  }
  .course-item input{width:18px;height:18px;accent-color:var(--accent-dark);flex:0 0 auto;}
  .course-name{font-weight:800;font-size:14.5px;line-height:1.35;}
  .course-date{font-size:12.5px;color:var(--ink-soft);margin-top:4px;}
  .empty-courses{
    font-size:13.5px;
    color:var(--ink-soft);
    padding:18px;
    text-align:center;
    border:1px dashed var(--line-strong);
    border-radius:var(--radius);
    background:#FBFAF7;
  }
  button.submit{
    width:100%;
    margin-top:30px;
    padding:15px;
    border:none;
    border-radius:var(--radius);
    background:linear-gradient(135deg, var(--accent), var(--accent-dark));
    color:#fff;
    font-family:inherit;
    font-size:15.5px;
    font-weight:700;
    cursor:pointer;
    box-shadow:0 14px 28px rgba(31,111,104,0.25);
    transition:transform .12s, box-shadow .12s;
  }
  button.submit:active{transform:translateY(1px);box-shadow:0 8px 18px rgba(31,111,104,0.2);}
  button.submit:disabled{opacity:0.5;cursor:not-allowed;}
  .msg{
    margin-top:14px;
    font-size:13px;
    text-align:center;
    min-height:18px;
  }
  .msg.error{color:var(--error);}
  .success-card{
    text-align:center;
    padding:46px 28px;
  }
  .success-card .icon{
    width:48px;height:48px;border-radius:50%;
    margin:0 auto 16px;
    display:grid;place-items:center;
    background:var(--accent-soft);
    color:var(--accent-dark);
    font-size:0;
  }
  .success-card .icon::before{content:"";width:18px;height:10px;border-left:3px solid currentColor;border-bottom:3px solid currentColor;transform:rotate(-45deg);margin-top:-4px;}
  .success-card h2{font-size:22px;margin:0 0 10px;letter-spacing:-0.02em;}
  .success-card p{font-size:14px;color:var(--ink-soft);margin:0;line-height:1.6;}
  @media (max-width:520px){
    body{padding:28px 14px 64px;}
    h1{font-size:27px;}
    .card{padding:24px 18px;}
    .course-item{align-items:flex-start;}
  }
</style>
</head>
<body>
<div class="wrap">
  <div class="eyebrow">전주MBC · K-디지털팀</div>
  <h1>2026 재직자 교육 신청</h1>
  <p class="sub">원하는 과정을 선택하고 기본 정보를 남겨주세요</p>

  <div class="card" id="formCard">
    <label for="name">이름</label>
    <input type="text" id="name" placeholder="홍길동">

    <label for="phone">연락처</label>
    <input type="tel" id="phone" placeholder="010-0000-0000">

    <label for="email">이메일 (선택)</label>
    <input type="email" id="email" placeholder="example@email.com">

    <label>신청 과정 (복수 선택 가능)</label>
    <div class="course-list" id="courseList">
      <div class="empty-courses">과정 목록을 불러오는 중...</div>
    </div>

    <button class="submit" id="submitBtn">신청하기</button>
    <div class="msg error" id="msg"></div>
  </div>

  <div class="card success-card" id="successCard" style="display:none;">
    <div class="icon">🌸</div>
    <h2>신청이 접수됐어요</h2>
    <p>담당자 확인 후 안내드릴게요. 감사합니다!</p>
  </div>
</div>

<script>
const SUPABASE_URL = "https://siwatwgncoiknnkglvok.supabase.co";
const SUPABASE_KEY = "sb_publishable_EcpVk6L5gekNjlvJLLcFRw_H7OWeExQ";
const sb = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

const courseListEl = document.getElementById('courseList');
const msgEl = document.getElementById('msg');
const submitBtn = document.getElementById('submitBtn');
let courses = [];
const selected = new Set();

async function loadCourses(){
  const { data, error } = await sb.from('courses').select('id,name,start_date').order('start_date', { ascending: true });
  if (error || !data || data.length === 0){
    courseListEl.innerHTML = '<div class="empty-courses">현재 신청 가능한 과정이 없습니다</div>';
    return;
  }
  courses = data;
  courseListEl.innerHTML = '';
  data.forEach(c => {
    const item = document.createElement('label');
    item.className = 'course-item';
    item.innerHTML = `
      <input type="checkbox" value="${c.id}">
      <div>
        <div class="course-name">${c.name}</div>
        ${c.start_date ? `<div class="course-date">${c.start_date} 시작</div>` : ''}
      </div>
    `;
    const checkbox = item.querySelector('input');
    checkbox.addEventListener('change', () => {
      if (checkbox.checked){ selected.add(c.id); item.classList.add('checked'); }
      else { selected.delete(c.id); item.classList.remove('checked'); }
    });
    courseListEl.appendChild(item);
  });
}
loadCourses();

submitBtn.addEventListener('click', async () => {
  msgEl.textContent = '';
  const name = document.getElementById('name').value.trim();
  const phone = document.getElementById('phone').value.trim();
  const email = document.getElementById('email').value.trim();

  if (!name){ msgEl.textContent = '이름을 입력해주세요.'; return; }
  if (!phone){ msgEl.textContent = '연락처를 입력해주세요.'; return; }
  if (selected.size === 0){ msgEl.textContent = '신청할 과정을 1개 이상 선택해주세요.'; return; }

  submitBtn.disabled = true;
  submitBtn.textContent = '처리 중...';

  const traineeId = crypto.randomUUID();
  const { error: traineeError } = await sb.from('trainees').insert({
    id: traineeId, name, phone, email: email || null
  });

  if (traineeError){
    msgEl.textContent = '오류가 발생했습니다. 다시 시도해주세요.';
    submitBtn.disabled = false;
    submitBtn.textContent = '신청하기';
    return;
  }

  const rows = Array.from(selected).map(courseId => ({
    trainee_id: traineeId, course_id: courseId
  }));
  const { error: appError } = await sb.from('applications').insert(rows);

  if (appError){
    msgEl.textContent = '신청 처리 중 오류가 발생했습니다.';
    submitBtn.disabled = false;
    submitBtn.textContent = '신청하기';
    return;
  }

  document.getElementById('formCard').style.display = 'none';
  document.getElementById('successCard').style.display = 'block';
});
</script>
</body>
</html>
